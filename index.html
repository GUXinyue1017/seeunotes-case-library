<!DOCTYPE html><html lang="zh-CN"><head><script id="seeu-generated-review-delete">
(function(){
  window.addEventListener('click',e=>{
    if(e.target.closest?.('.library-note,.nav-card')){
      document.body.classList.remove('library-open');
      document.querySelector('.library-toggle')?.setAttribute('aria-expanded','false');
    }
  },true);
  function flipReviewHint(e){
    const hint=e.target.closest?.('#reviewPanelContent .qa-hint');
    if(!hint)return;
    if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return;
    e.preventDefault();e.stopImmediatePropagation();
    if(e.type==='dblclick'||e.detail>1)return;
    const card=hint.closest('.qa-flip');if(!card)return;
    card.dataset.side=card.dataset.side==='a'?'q':'a';
    hint.textContent=card.dataset.side==='a'?'返回问题':'查看参考答案';
    hint.setAttribute('aria-label',hint.textContent);
    window.__seeuReviewEditing=false;
    document.getElementById('caseReview').innerHTML=document.getElementById('reviewPanelContent').innerHTML;
    persist(document.getElementById('reviewPanelContent'));
  }
  for(const event of ['click','dblclick','keydown'])window.addEventListener(event,flipReviewHint,true);
  window.addEventListener('keydown',e=>{
    const text=e.target.closest?.('.list-item-text');if(!text||e.isComposing)return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){
      e.preventDefault();e.stopImmediatePropagation();const range=document.createRange();range.selectNodeContents(text);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);return;
    }
    if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      e.preventDefault();e.stopImmediatePropagation();
      const selection=getSelection();
      if(selection.rangeCount&&!selection.isCollapsed&&text.contains(selection.anchorNode)&&text.contains(selection.focusNode)){
        document.execCommand('delete');
      }
      // Enter finishes this item. Shift+Enter remains an intentional line break.
      text.blur();if(typeof saveNotes==='function')saveNotes();
    }
  },true);
  const deleted=[];
  let changing=false;
  window.addEventListener('change',function(e){
    if(e.target.id==='uploadFile' && window.seeuUpload){
      e.stopImmediatePropagation();
      window.seeuUpload.selectFile();
    }
  },true);
  window.addEventListener('click',function(e){
    const button=e.target.closest && e.target.closest('#generateNoteBtn,#clearUploadBtn');
    if(!button || !window.seeuUpload) return;
    e.preventDefault();e.stopImmediatePropagation();
    if(button.id==='generateNoteBtn') window.seeuUpload.generate();
    else window.seeuUpload.clear();
  },true);
  window.addEventListener('blur',function(e){
    if(changing && e.target.closest && e.target.closest('#reviewPanelContent')) e.stopImmediatePropagation();
  },true);
  function persist(panel){
    document.getElementById('caseReview').innerHTML=panel.innerHTML;
    const view=document.querySelector('.view.active');
    const data=getStore();
    const key=view.dataset.case;
    data[key]=data[key] || {};
    data[key].review=panel.innerHTML;
    data[key].annotations=document.getElementById('annotations').innerHTML;
    setStore(data);
    if(typeof flashSaved==='function') flashSaved();
  }
  window.addEventListener('click',function(e){
    const button=e.target.closest && e.target.closest('#reviewPanelContent .qa-delete');
    const view=document.querySelector('.view.active');
    if(!button || !view || !view.id.startsWith('view-generated')) return;
    e.preventDefault();e.stopImmediatePropagation();
    const panel=document.getElementById('reviewPanelContent');
    const card=button.closest('.qa-flip');
    if(!card) return;
    deleted.push({key:view.dataset.case,html:panel.innerHTML});
    const cards=Array.from(panel.querySelectorAll('.qa-flip'));
    let index=cards.indexOf(card);
    if(index<0) index=cards.findIndex(c=>c.querySelector('.qa-question').textContent===card.querySelector('.qa-question').textContent && c.querySelector('.qa-answer').textContent===card.querySelector('.qa-answer').textContent);
    if(index<0) return;
    const copy=panel.cloneNode(true);
    const copiedCard=copy.querySelectorAll('.qa-flip')[index];
    if(!copiedCard) return;
    copiedCard.remove();
    document.getElementById('caseReview').innerHTML=copy.innerHTML;
    changing=true;
    try{panel.innerHTML=copy.innerHTML;}finally{changing=false;}
    persist(panel);
  },true);
  window.addEventListener('keydown',function(e){
    if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.key.toLowerCase()!=='z') return;
    const view=document.querySelector('.view.active');
    const entry=deleted[deleted.length-1];
    if(!entry || !view || entry.key!==view.dataset.case || !document.body.classList.contains('review-mode')) return;
    e.preventDefault();e.stopImmediatePropagation();deleted.pop();
    const panel=document.getElementById('reviewPanelContent');
    changing=true;
    try{panel.innerHTML=entry.html;}finally{changing=false;}
    persist(panel);
  },true);
})();

/* ===== 批注乱码彻底修复：只在单个文字节点内上色，跨行只生成右侧批注 ===== */
function closestTextUnit(node){
  if(!node) return null;
  let el = node.nodeType === 1 ? node : node.parentElement;
  return el ? el.closest('li,p,.quote-list p,.advice-row p,.tagpill,h2,h3,.overview-lines span') : null;
}
function isSafeSingleTextRange(range){
  return range
    && range.startContainer === range.endContainer
    && range.startContainer.nodeType === Node.TEXT_NODE
    && range.toString().trim().length > 0;
}
function wrapSafeRange(className, title){
  if(!restoreSelection()) return false;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0) return false;
  const range = sel.getRangeAt(0);
  if(!isSafeSingleTextRange(range)) return false;
  const unit = closestTextUnit(range.startContainer);
  if(!unit) return false;
  const mark = document.createElement('mark');
  mark.className = className;
  if(title) mark.title = title;
  try{
    range.surroundContents(mark);
  }catch(e){
    return false;
  }
  sel.removeAllRanges();
  return true;
}
function addAnnotation(){
  if(!restoreSelection()) return;
  const sel = window.getSelection();
  const text = sel.toString().trim();
  if(!text) return;

  wrapSafeRange('annotation-yellow', '点击可去掉高亮');

  const box = document.createElement('div');
  box.className = 'ann';
  box.innerHTML = '<q>' + text.replace(/[<>]/g,'') + '</q><div contenteditable="true">我的批注：</div>';
  document.getElementById('annotations').prepend(box);

  if(sel) sel.removeAllRanges();
  document.getElementById('toolbar').style.display='none';
  saveNotes();
}
function markRed(){
  if(!restoreSelection()) return;
  const sel = window.getSelection();
  const text = sel.toString().trim();
  if(!text) return;

  const ok = wrapSafeRange('redline', '点击可去掉画线');
  if(!ok){
    alert('请只选中同一条句子内的文字再标红，避免跨行破坏排版。');

  document.getElementById('toolbar').style.display='none';

}

/* ===== 列表编辑体验：单次 Enter 换行，连续两次 Enter 新增要点 ===== */
(function(){
  let lastEnter = { el: null, time: 0 };

  function focusEnd(el){
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function insertLineBreak(){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const br = document.createElement('br');
    range.insertNode(br);
    range.setStartAfter(br);
    range.setEndAfter(br);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function removeTrailingBr(li){
    while(li.lastChild && li.lastChild.nodeType === 3 && li.lastChild.textContent === ''){
      li.removeChild(li.lastChild);
    }
    if(li.lastChild && li.lastChild.nodeName === 'BR'){
      li.removeChild(li.lastChild);
    }
  }

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;

    const li = e.target && e.target.closest ? e.target.closest('.note-block li[contenteditable="true"], .note-block li') : null;
    if(!li || !li.isContentEditable) return;

    e.preventDefault();

    const now = Date.now();
    const isDoubleEnter = lastEnter.el === li && now - lastEnter.time < 650;

    if(isDoubleEnter){
      removeTrailingBr(li);
      const newLi = document.createElement('li');
      newLi.setAttribute('contenteditable','true');
      newLi.setAttribute('spellcheck','false');
      newLi.innerHTML = '';
      li.insertAdjacentElement('afterend', newLi);
      lastEnter = { el: null, time: 0 };
      focusEnd(newLi);
      if(typeof saveNotes === 'function') saveNotes();
      return;
    }

    insertLineBreak();
    lastEnter = { el: li, time: now };
    if(typeof saveNotes === 'function') saveNotes();
  }, true);
})();

/* ===== 复习模式稳定编辑：单击文字=连续编辑；双击提示按钮=切换问题/答案；失焦后保存 ===== */
(function(){
  function panel(){ return document.getElementById('reviewPanelContent'); }
  function box(){ return document.getElementById('caseReview'); }

  function setCaretFromPoint(el, x, y){
    try{
      let range;
      if(document.caretRangeFromPoint){
        range = document.caretRangeFromPoint(x,y);
      }else if(document.caretPositionFromPoint){
        const pos=document.caretPositionFromPoint(x,y);
        range=document.createRange();
        range.setStart(pos.offsetNode,pos.offset);
      }
      if(range && el.contains(range.startContainer)){
        range.collapse(true);
        const sel=window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }catch(err){}
  }

  function makeEditable(root){
    if(!root) return;
    root.querySelectorAll('.qa-question,.qa-answer').forEach(el=>{
      el.setAttribute('contenteditable','plaintext-only');
      el.setAttribute('spellcheck','false');
      el.style.userSelect='text';
      el.style.webkitUserSelect='text';
      el.style.cursor='text';
    });
    root.querySelectorAll('.qa-hint').forEach(h=>{
      h.style.cursor='pointer';
      h.title='双击切换问题/参考答案';
      if(h.textContent.trim()==='') h.textContent = '双击切换';
    });
  }

  function commitReviewEdit(){
    const p=panel(), b=box();
    if(p && b && document.body.classList.contains('review-mode')){
      b.innerHTML = p.innerHTML;
      window.__seeuReviewEditing = false;
      if(typeof saveNotes === 'function') saveNotes();
      makeEditable(p);
    }
  }

  const oldUpdate = typeof updateReviewPanel === 'function' ? updateReviewPanel : null;
  updateReviewPanel = function(){
    if(window.__seeuReviewEditing) return;
    if(oldUpdate) oldUpdate();
    makeEditable(panel());
  };

  window.addEventListener('mousedown', function(e){
    const editable = __seeuReviewEditableTarget(e);
    if(!editable) return;
    e.stopPropagation();
    e.stopImmediatePropagation();
  }, true);

  window.addEventListener('click', function(e){
    const editable = __seeuReviewEditableTarget(e);
    if(editable){
      e.stopPropagation();
      e.stopImmediatePropagation();
      window.__seeuReviewEditing = true;
      editable.setAttribute('contenteditable','plaintext-only');
      editable.focus();
      setTimeout(()=>setCaretFromPoint(editable,e.clientX,e.clientY),0);
      return;
    }

    const hint = e.target.closest && e.target.closest('#reviewPanelContent .qa-hint');
    if(hint){
      e.stopPropagation();
      e.stopImmediatePropagation();
      e.preventDefault();
      return;
    }
  }, true);

  window.addEventListener('dblclick', function(e){
    const hint = e.target.closest && e.target.closest('#reviewPanelContent .qa-hint');
    if(!hint) return;
    const item = hint.closest('.qa-flip');
    if(!item) return;
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    item.dataset.side = item.dataset.side === 'a' ? 'q' : 'a';
    commitReviewEdit();
  }, true);

  window.addEventListener('blur', function(e){
    if(__seeuReviewEditableTarget(e)){
      setTimeout(commitReviewEdit, 30);
    }
  }, true);

  window.addEventListener('keydown', function(e){
    if(__seeuReviewEditableTarget(e)){
      e.stopPropagation();
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
        e.preventDefault();
        commitReviewEdit();
      }
    }
  }, true);

  setTimeout(()=>makeEditable(panel()),150);
})();

</script>

<script>
/* ===== SeeUNotes v0.2 Settings: Focus + Light/Dark + Theme + Language ===== */
(function(){
  const FOCUS_KEY='seeu_focus_mode',DARK_KEY='seeu_dark_mode',THEME_KEY='seeu_theme',LANG_KEY='seeu_lang';
  const themeNames={academic:{zh:'学术风',en:'Academic'},paper:{zh:'纸质风',en:'Paper'},zen:{zh:'森林风',en:'Forest'}};
  function applyLanguage(lang){
    document.documentElement.lang=lang==='en'?'en':'zh-CN';
    document.querySelectorAll('[data-zh][data-en]').forEach(el=>{el.textContent=el.getAttribute(lang==='en'?'data-en':'data-zh')});
    const labels=document.querySelectorAll('.setting-pill span');
    if(labels[0])labels[0].textContent=lang==='en'?'Theme':'主题';
    if(labels[1])labels[1].textContent=lang==='en'?'Language':'语言';
    const ts=document.getElementById('themeSelect');
    if(ts)Array.from(ts.options).forEach(o=>{if(themeNames[o.value])o.textContent=themeNames[o.value][lang]});
  }
  function applyMode(){
    const focus=localStorage.getItem(FOCUS_KEY)==='1';
    const dark=localStorage.getItem(DARK_KEY)==='1';
    const theme=(['academic','paper','zen'].includes(localStorage.getItem(THEME_KEY))?localStorage.getItem(THEME_KEY):'academic');
    const lang=localStorage.getItem(LANG_KEY)||'zh';
    document.body.classList.toggle('focus-mode',focus);
    document.body.classList.toggle('dark-mode',dark);
    document.body.setAttribute('data-theme',theme);
    const f=document.getElementById('focusModeBtn'),d=document.getElementById('darkModeBtn'),t=document.getElementById('themeSelect'),l=document.getElementById('langSelect');
    if(f)f.textContent=lang==='en'?(focus?'Exit':'Focus'):(focus?'退出':'专注');
    if(d)d.textContent=lang==='en'?(dark?'Light':'Dark'):(dark?'浅色':'深色');
    if(t)t.value=theme;if(l)l.value=lang;applyLanguage(lang);
  }
  function bind(){
    const f=document.getElementById('focusModeBtn'),d=document.getElementById('darkModeBtn'),t=document.getElementById('themeSelect'),l=document.getElementById('langSelect');
    if(f)f.onclick=()=>{localStorage.setItem(FOCUS_KEY,localStorage.getItem(FOCUS_KEY)==='1'?'0':'1');applyMode()};
    if(d)d.onclick=()=>{const next=!(localStorage.getItem(DARK_KEY)==='1');localStorage.setItem(DARK_KEY,next?'1':'0');applyMode()};
    if(t)t.onchange=()=>{localStorage.setItem(THEME_KEY,t.value);applyMode()};
    if(l)l.onchange=()=>{localStorage.setItem(LANG_KEY,l.value);applyMode()};
    applyMode();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>

    list.appendChild(item);

      q.focus();

  // 悬浮球爆破交互
  document.addEventListener('click',function(e){

    e.preventDefault();

    const hero=orb.closest('.hero');
    const or=orb.getBoundingClientRect();
    const hr=hero.getBoundingClientRect();
    const cx=or.left-hr.left+or.width/2;
    const cy=or.top-hr.top+or.height/2;
    orb.classList.remove('is-burst');
    void orb.offsetWidth;
    orb.classList.add('is-burst');
    for(let i=0;i<14;i++){
      const p=document.createElement('span');
      p.className='orb-particle';
      const a=(Math.PI*2/14)*i;
      const dist=42+Math.random()*48;
      p.style.setProperty('--x',cx+'px');
      p.style.setProperty('--y',cy+'px');
      p.style.setProperty('--dx',Math.cos(a)*dist+'px');
      p.style.setProperty('--dy',Math.sin(a)*dist+'px');
      hero.appendChild(p);
      setTimeout(()=>p.remove(),820);
    }
    setTimeout(()=>orb.classList.remove('is-burst'),680);
  },true);

  // 新增复习问答

<script>
/* ===== v1.0.9: Wheel section snapping + delete review Q&A ===== */
(function(){
  function isEditableTarget(t){
    return !!(t && t.closest && t.closest('input,textarea,select,[contenteditable="true"],[contenteditable="plaintext-only"],.qa-question,.qa-answer,.editable'));
  }
  function activeNavIndex(){
    const cards=[...document.querySelectorAll('#nav .nav-card')];
    return cards.findIndex(c=>c.classList.contains('active'));
  }
  function goNav(delta){
    const cards=[...document.querySelectorAll('#nav .nav-card')];
    if(!cards.length) return false;
    const cur=activeNavIndex();
    const next=Math.max(0,Math.min(cards.length-1,(cur<0?0:cur)+delta));
    if(next===cur || next<0) return false;
    cards[next].click();
    cards[next].classList.remove('snap-pulse');
    void cards[next].offsetWidth;
    cards[next].classList.add('snap-pulse');
    cards[next].scrollIntoView({block:'nearest',behavior:'smooth'});
    return true;
  }
  let acc=0, timer=null, locked=false;
  document.addEventListener('wheel',function(e){
    if(document.body.classList.contains('review-mode')) return;
    if(isEditableTarget(e.target)) return;
    const shell=e.target.closest && e.target.closest('.main-shell,.view,.sidebar');
    if(!shell) return;
    const dy=e.deltaY || 0;
    if(Math.abs(dy)<18) return;
    acc += dy;
    clearTimeout(timer);
    timer=setTimeout(()=>{acc=0;},220);
    const strong=Math.abs(dy)>360 || Math.abs(acc)>620;
    if(!strong || locked) return;
    const direction=acc>0?1:-1;
    if(goNav(direction)){
      e.preventDefault();
      locked=true; acc=0;
      setTimeout(()=>{locked=false;},520);
    }
  },{passive:false});

  function persistReviewFromPanelV109(){
    try{
      const panel=document.getElementById('reviewPanelContent');
      const box=document.getElementById('caseReview');
      if(!panel || !box) return;
      box.innerHTML=panel.innerHTML;
      if(typeof window.persistReviewFromPanel==='function') return window.persistReviewFromPanel();
      const view=document.querySelector('.view.active');
      const key=view ? (view.dataset.case||'overview') : 'overview';
      const d=typeof getStore==='function' ? getStore() : JSON.parse(localStorage.getItem('seeu_notes_store')||'{}');
      d[key]=d[key]||{};
      d[key].review=box.innerHTML;
      if(typeof setStore==='function') setStore(d); else localStorage.setItem('seeu_notes_store',JSON.stringify(d));

  function enhanceReviewQA(root){

        btn.title='删除这条问题/回答';
        btn.textContent='×';
        item.appendChild(btn);
      }

    const list=root.querySelector('.qa-list');
    if(list && !list.children.length && !root.querySelector('.review-empty-note')){
      const empty=document.createElement('div');
      empty.className='review-empty-note';
      empty.textContent='暂无复习问题，点击下方“新增问题/回答”添加。';
      root.appendChild(empty);
    }else if(list && list.children.length){
      root.querySelectorAll('.review-empty-note').forEach(n=>n.remove());
    }
  }
  document.addEventListener('click',function(e){
    const del=e.target.closest && e.target.closest('#reviewPanelContent .qa-delete');
    if(!del) return;
    e.preventDefault();
    e.stopPropagation();
    const item=del.closest('.qa-flip');
    if(item){
      const list=item.parentElement;
      item.remove();
      if(list && !list.children.length){
        const content=document.getElementById('reviewPanelContent');
        if(content && !content.querySelector('.review-empty-note')){
          const empty=document.createElement('div');
          empty.className='review-empty-note';
          empty.textContent='暂无复习问题，点击下方“新增问题/回答”添加。';
          content.appendChild(empty);
        }
      }
      persistReviewFromPanelV109();
    }
  },true);
  const mo=new MutationObserver(()=>enhanceReviewQA());
  function start(){
    const root=document.getElementById('reviewPanelContent');
    if(root){mo.observe(root,{childList:true,subtree:true});enhanceReviewQA(root);}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  const oldToggle=window.toggleReviewMode;
  window.toggleReviewMode=function(force){
    if(typeof oldToggle==='function') oldToggle(force);
    setTimeout(()=>enhanceReviewQA(),90);
  };
  const oldUpdate=window.updateReviewPanel;
  window.updateReviewPanel=function(){
    if(typeof oldUpdate==='function') oldUpdate();
    setTimeout(()=>enhanceReviewQA(),40);

})();

  // 强滚轮切换目录：专业术语常叫 Wheel-based section snapping / Scroll Snap Navigation。
  function isEditing(t){return !!(t && t.closest && t.closest('input,textarea,select,[contenteditable="true"],[contenteditable="plaintext-only"],.editable,.qa-question,.qa-answer'));}
  function navCards(){return [...document.querySelectorAll('#nav .nav-card')];}
  function activeIndex(){return navCards().findIndex(c=>c.classList.contains('active'));}
  function go(delta){
    const cards=navCards(); if(!cards.length) return false;
    const cur=activeIndex(); const next=Math.max(0,Math.min(cards.length-1,(cur<0?0:cur)+delta));
    if(next===cur) return false;
    cards[next].click();

    if(!strong || locked) return;
    if(go(acc>0?1:-1)){e.preventDefault(); locked=true; acc=0; setTimeout(()=>locked=false,560);}
  },{passive:false});

  const mo=new MutationObserver(()=>enhanceAll(document));
  function start(){enhanceAll(document); mo.observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  const oldLoad=window.loadNotes;

<script id="seeu-v1-0-12-editable-undo-patch">
/* ===== v1.0.12: editable list blocks + undoable structural deletes ===== */
(function(){
  const DELETE_SELECTOR = '.advice-row,.quote-list p,.method-item,#reviewPanelContent .qa-flip,.note-block li';
  const undoStack = [];
  let restoring = false;
  let methodologyItemPatched = false;

  function persist(){
    try{ if(typeof saveNotes === 'function') saveNotes(); }catch(e){}
    try{
      if(typeof persistReviewFromPanel === 'function'){
        const panel=document.getElementById('reviewPanelContent');
        const box=document.getElementById('caseReview');
        if(panel && box) box.innerHTML=panel.innerHTML;
        persistReviewFromPanel();
      }
    }catch(e){}
  }

  function focusEnd(el){
    if(!el) return;
    el.focus();
    const range=document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function normalizeAddLabels(root=document){
    root.querySelectorAll('.add-advice-btn,.add-quote-btn,.add-method-btn,.add-list-item-btn').forEach(btn=>{
      if(btn.textContent.trim()!=='＋ 新增') btn.textContent='＋ 新增';
      btn.setAttribute('aria-label','新增');
      btn.title='新增';
    });
    const review=document.getElementById('addReviewQA');
    if(review){
      if(review.textContent.trim()!=='＋ 新增') review.textContent='＋ 新增';
      review.setAttribute('aria-label','新增');
      review.title='新增';
    }
  }

  function ensureMethodologyItem(){}

  function makeDeleteButton(cls,title){
    const btn=document.createElement('button');
    btn.type='button';
    btn.className=cls;
    btn.contentEditable='false';
    btn.setAttribute('aria-label',title);
    btn.title=title;
    btn.textContent='×';
    return btn;
  }

  function enhanceListBlocks(root=document){
    root.querySelectorAll('.note-block.asker ul').forEach(ul=>{
      ul.querySelectorAll('li').forEach(li=>{
        li.setAttribute('contenteditable','false');
        let text=li.querySelector(':scope > .list-item-text');
        if(!text){
          text=document.createElement('div');text.className='list-item-text';
          for(const node of [...li.childNodes])if(!(node.nodeType===1&&node.matches('.list-delete-btn')))text.appendChild(node);
          while(text.lastChild?.nodeName==='BR')text.lastChild.remove();
          li.prepend(text);
        }
        text.setAttribute('contenteditable','plaintext-only');text.setAttribute('spellcheck','false');
        text.setAttribute('role','textbox');text.setAttribute('aria-label','条目内容');
        if(!li.querySelector(':scope > .list-delete-btn')){
          li.appendChild(makeDeleteButton('list-delete-btn','删除这一条'));
        }
      });
      const block=ul.closest('.note-block');
      if(block && !block.querySelector(':scope > .list-edit-actions .add-list-item-btn')){
        const actions=document.createElement('div');
        actions.className='list-edit-actions';
        const add=document.createElement('button');
        add.type='button';
        add.className='add-list-item-btn';
        add.contentEditable='false';
        add.textContent='＋ 新增';
        actions.appendChild(add);
        ul.insertAdjacentElement('afterend',actions);
      }
    });
  }

  function enhanceAll(root=document){
    ensureMethodologyItem();
    enhanceListBlocks(root);
    normalizeAddLabels(root);
  }

  function pushDeleteUndo(node){
    if(restoring || !node || !node.matches || !node.matches(DELETE_SELECTOR)) return;
    const parent=node.parentNode;
    if(!parent) return;
    undoStack.push({
      parent,
      next:node.nextSibling,
      node:node.cloneNode(true),
      caseKey:typeof current !== 'undefined' ? current : null
    });
    if(undoStack.length>80) undoStack.shift();
  }

  const originalRemove = Element.prototype.remove;
  Element.prototype.remove = function(){
    pushDeleteUndo(this);
    return originalRemove.call(this);
  };

  const originalRemoveChild = Node.prototype.removeChild;
  Node.prototype.removeChild = function(child){
    pushDeleteUndo(child);
    return originalRemoveChild.call(this, child);
  };

  function undoDelete(){
    const entry=undoStack.pop();
    if(!entry || !entry.parent || !entry.node) return false;
    restoring=true;
    try{
      entry.parent.insertBefore(entry.node, entry.next && entry.next.parentNode===entry.parent ? entry.next : null);
      enhanceAll(document);
      if(entry.node.matches && entry.node.matches('#reviewPanelContent .qa-flip')){
        const panel=document.getElementById('reviewPanelContent');
        const box=document.getElementById('caseReview');
        if(panel && box) box.innerHTML=panel.innerHTML;
      }
      persist();
      const firstEditable=entry.node.querySelector && entry.node.querySelector('[contenteditable]');
      focusEnd(firstEditable || entry.node);
    }finally{
      restoring=false;
    }
    return true;
  }

  document.addEventListener('keydown',function(e){
    const isUndo=(e.key||'').toLowerCase()==='z' && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey;
    if(!isUndo) return;
    if(!undoStack.length) return;
    const active=document.activeElement;
    const editing=active && active.closest && active.closest('[contenteditable="true"],[contenteditable="plaintext-only"],input,textarea');
    if(editing && active.textContent && active.textContent.length) return;
    e.preventDefault();
    e.stopPropagation();
    undoDelete();
  },true);

  document.addEventListener('click',function(e){
    const addList=e.target.closest && e.target.closest('.add-list-item-btn');
    if(addList){
      e.preventDefault();
      e.stopPropagation();
      const block=addList.closest('.note-block');
      const ul=block && block.querySelector('ul');
      if(!ul) return;
      const li=document.createElement('li');
      li.setAttribute('contenteditable','plaintext-only');
      li.setAttribute('spellcheck','false');
      li.textContent='在这里输入新的内容。';
      li.appendChild(makeDeleteButton('list-delete-btn','删除这一条'));
      ul.appendChild(li);
      enhanceListBlocks(block);
      focusEnd(li.querySelector('.list-item-text'));
      persist();
      return;
    }

    const delList=e.target.closest && e.target.closest('.list-delete-btn');
    if(delList){
      e.preventDefault();
      e.stopPropagation();
      const li=delList.closest('li');
      if(li){ li.remove(); persist(); }
    }
  },true);

  document.addEventListener('input',function(e){
    if(e.target.closest && e.target.closest('.note-block.asker ul,#view-methods .method-list,.advice-stack,.quote-list,#reviewPanelContent')){
      enhanceAll(document);
      persist();
    }
  },true);

  const oldAppendQA=window.appendQA;
  if(typeof oldAppendQA === 'function'){
    window.appendQA=function(){
      oldAppendQA();

<script>

(function(){

  function hiddenBox(){ return document.getElementById('caseReview'); }

  function ensureReviewDeleteButtons(root){

    if(typeof saveNotes==='function') saveNotes();

})();

<script id="seeu-upload-generator">

  const found=[];if(!needle)return found;
  let at=haystack.indexOf(needle,from);
  while(at>=0&&at+needle.length<=to){found.push(at);at=haystack.indexOf(needle,at+1);}
  return found;
}
function sliceCaseTranscripts(raw,cases){
  const indexes=[indexedText(raw),indexedText(raw,true),indexedText(raw,true,true)];let cursor=0;
  return cases.map((c,i)=>{
    let reason='missing-anchors';
    for(let mode=0;mode<3;mode++){
      const index=indexes[mode];
      const start=indexedText(String(c.rawStart||''),!!mode).text;
      const end=indexedText(String(c.rawEnd||''),!!mode).text;
      if(start.length<6||end.length<6)continue;
      reason='anchor-not-found';
      const from=index.starts.findIndex(offset=>offset>=cursor);
      if(from<0)continue;
      const starts=occurrences(index.text,start,from);
      if(starts.length!==1){if(starts.length)reason='ambiguous-start';continue;}
      const at=starts[0];
      const next=indexedText(String(cases[i+1]?.rawStart||''),!!mode).text;
      const boundary=next.length>=6?index.text.indexOf(next,at+start.length):-1;
      const ends=occurrences(index.text,end,at,boundary<0?index.text.length:boundary).filter(pos=>pos+end.length>=at+start.length);
      if(ends.length!==1){reason=ends.length?'ambiguous-end':'end-not-found';continue;}
      const rawStart=index.starts[at];let rawEnd=index.ends[ends[0]+end.length-1];
      if(mode)while(rawEnd<raw.length&&/\p{P}/u.test(raw[rawEnd]))rawEnd++; 
      cursor=rawEnd;
      return {rawTranscript:raw.slice(rawStart,rawEnd),rawMatchStatus:mode===2?'metadata-normalized':mode?'normalized':'exact',sourceStart:rawStart,sourceEnd:rawEnd};
    }
    // Compatibility for an older model response, only if it is literally present in source.
    const legacy=typeof c.rawTranscript==='string'?c.rawTranscript.trim():'';
    const at=legacy && !(cases.length>1&&legacy===raw.trim())?raw.indexOf(legacy,cursor):-1;
    if(at>=0&&raw.indexOf(legacy,at+1)<0){cursor=at+legacy.length;return {rawTranscript:raw.slice(at,cursor),rawMatchStatus:'legacy-exact',sourceStart:at,sourceEnd:cursor};}
    return {rawTranscript:'',rawMatchStatus:reason};
  });
}

  async function readMaterialFile(file){
    const buffer=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(new Error('文件读取失败，请重新选择文件。'));
      reader.readAsArrayBuffer(file);
    });
    const bytes=new Uint8Array(buffer);
    if(bytes[0]===0xff && bytes[1]===0xfe) return new TextDecoder('utf-16le').decode(bytes);
    if(bytes[0]===0xfe && bytes[1]===0xff) return new TextDecoder('utf-16be').decode(bytes);
    if(bytes.length>3 && bytes[1]===0 && bytes[3]===0) return new TextDecoder('utf-16le').decode(bytes);
    try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes);}
    catch(e){return new TextDecoder('gb18030').decode(bytes);}
  }

  async function awaitJob(job){
    let failures=0;
    for(;;){
      try{
        const result=await requestJSON('/api/jobs/'+encodeURIComponent(job.id));failures=0;
        if(result.status==='succeeded')return result.note;
        if(result.status==='failed')throw Object.assign(new Error(result.error),{terminal:true});
        stage(result.stage||'正在整理笔记',job.startedAt);
      }catch(e){
        if(e.status===404||e.terminal){e.terminal=true;throw e;}
        stage('连接暂时中断，正在重新检查原任务',job.startedAt);
        if(++failures>=12)throw new Error('暂时无法连接服务器。任务信息已保留；刷新页面可继续查询，不会重复生成。');
      }
      await pause(2500);
    }
  }
  function acceptNote(note,job){
    if(!note||!(note.kind==='structured'?note.sections?.length:note.cases?.length))throw new Error('服务器未返回可用笔记。');
    const item={schemaVersion:2,ownerId:'local',key:'generated-'+job.id,title:note.title,note,category:job.category||'未分类',createdAt:new Date(job.startedAt).toISOString()};
    const list=readGenerated().filter(x=>x.key!==item.key);list.push(item);
    writeGenerated(list); // Never claim success before durable browser storage succeeds.
    localStorage.removeItem(PENDING);
    renderHistory();openGenerated(item);
    document.getElementById('uploadStatus').textContent='笔记已生成并保存到本机笔记库。';
  }
  async function resumeJob(job){
    if(generating)return;
    setBusy(true);stage('正在恢复生成任务',job.startedAt);
    try{acceptNote(await awaitJob(job),job);}
    catch(e){if(e.terminal)localStorage.removeItem(PENDING);document.getElementById('uploadStatus').textContent=displayError(e.message);}
    finally{clearInterval(generationTimer);setBusy(false);if(pendingJob())document.getElementById('generateNoteBtn').textContent='继续检查生成结果';}
  }
  async function generateFromInput(){
    if(generating)return;
    // Web Locks serializes admission across tabs; the persisted job is rechecked inside it.
    const run=async()=>{
      if(generating)return;
      const pending=pendingJob();if(pending){await resumeJob(pending);return;}
      const status=document.getElementById('uploadStatus');
      const file=document.getElementById('uploadFile')?.files?.[0];
      if(!file){status.textContent='请先选择文字文件。';return;}
      const chosen=document.getElementById('uploadCategory').value;
      const category=chosen==='__new'?document.getElementById('newCategory').value.trim():chosen;
      if(!category){status.textContent='请先选择或新建保存文件夹。';document.getElementById(chosen==='__new'?'newCategory':'uploadCategory').focus();return;}
      setBusy(true);
      let job=null;
      try{
        if(!/^https?:$/.test(location.protocol))throw new Error('请在网站地址或本地预览服务中打开页面后生成笔记。');
        if(!/\.(txt|md|markdown)$/i.test(file.name))throw new Error('请选择 TXT 或 Markdown 文字文件。');
        stage('正在读取材料',Date.now());
        const text=(await readMaterialFile(file)).replace(/^\uFEFF/,'').trim();
        if(!text||text.length>200000)throw new Error('请选择有文字内容且不超过 20 万字的材料。');
        stage('正在连接生成服务',Date.now());
        let state=await requestJSON('/api/status');
        if(state.configured===false)throw new Error('生成服务尚未配置完成，请检查后端 API 环境变量。');
        const queuedAt=Date.now();
        while(state.busy){stage('服务器正在处理其他材料，等待空闲',queuedAt);await pause(3000);state=await requestJSON('/api/status');}
        job={id:crypto.randomUUID(),startedAt:Date.now(),category};
        localStorage.setItem(PENDING,JSON.stringify(job));
        stage('材料已读取，正在提交生成任务',job.startedAt);
        const body=JSON.stringify({requestId:job.id,text,fileName:file.name,title:document.getElementById('uploadTitle').value.trim()});
        // Retrying this token cannot start a second AI call on the same server.
        let sent=false;
        for(let attempt=0;attempt<3&&!sent;attempt++){
          try{await requestJSON('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body});sent=true;}
          catch(e){if(e.status===429){localStorage.removeItem(PENDING);stage('服务器正在处理另一份材料，等待空闲',job.startedAt);while((await requestJSON('/api/status')).busy)await pause(3000);throw new Error('服务已空闲，可以重新点击生成笔记。');}if(e.status&&e.status<500){localStorage.removeItem(PENDING);throw e;}if(attempt===2)throw new Error('提交连接中断，任务标识已保存。请点击“继续检查生成结果”。');await pause(1500);}
        }
        stage('正在整理笔记',job.startedAt);
        acceptNote(await awaitJob(job),job);
      }catch(e){if(e.terminal)localStorage.removeItem(PENDING);status.textContent=e.name==='QuotaExceededError'?'本机存储空间不足，生成结果暂留服务器一小时。请释放空间后点击继续检查。':displayError(e.message);}
      finally{clearInterval(generationTimer);setBusy(false);if(pendingJob())document.getElementById('generateNoteBtn').textContent='继续检查生成结果';}
    };
    if(navigator.locks)await navigator.locks.request('seeu-generation',{ifAvailable:true},async lock=>{if(lock)await run();else document.getElementById('uploadStatus').textContent='另一个标签页正在生成，请等待完成或刷新恢复。';});
    else await run();
  }
 function clearUpload(){
  if(generating || pendingJob()) return;
  const title=document.getElementById('uploadTitle');
  const file=document.getElementById('uploadFile');
  const status=document.getElementById('uploadStatus');
  const button=document.getElementById('generateNoteBtn');

  if(title) title.value='';
  if(file) file.value='';
  document.getElementById('selectedFile').textContent='';
  if(status) status.textContent='';

  if(button){
    button.disabled=false;
    button.textContent='生成笔记';
  }
}
  const originalShowView=window.showView;
  function readingState(k){
    const reading=k!=='upload' && k.startsWith('generated');
    document.body.classList.toggle('seeu-uploading',!reading);
    document.body.classList.toggle('seeu-reading',reading);
    document.querySelector('#nav').hidden=!reading;
    document.querySelector('[data-target="upload"]').classList.toggle('active',!reading);
    if(!reading){document.body.classList.remove('review-mode');openedItem=null;renderHistory();}
    localStorage.setItem(LAST_VIEW,k);
  }
  window.showView=function(k){
    originalShowView(k);readingState(k);
    if(document.body.classList.contains('focus-mode') && k!=='upload'){
      requestAnimationFrame(()=>document.getElementById('view-'+k)?.scrollIntoView({block:'start',behavior:'instant'}));
    }
  };
  const shell=document.querySelector('.main-shell');
  function selectVisibleView(view){
    if(!view || view.dataset.case===current)return;
    saveNotes();current=view.dataset.case;
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v===view));
    document.querySelectorAll('#nav .nav-card').forEach(b=>b.classList.toggle('active',b.dataset.target===current));
    // Only change the side panel; replacing the article here would disrupt selection/editing.
    __oldLoadNotes(current);normalizeReviewQA();updateReviewPanel();if(window.enhanceAnnotations)window.enhanceAnnotations();
    localStorage.setItem(LAST_VIEW,current);
  }
  function continuous(){return document.body.classList.contains('focus-mode')&&document.body.classList.contains('seeu-reading');}
  let scrollQueued=false;
  shell.addEventListener('scroll',()=>{
    if(!continuous()||scrollQueued||document.body.classList.contains('review-mode'))return;
    scrollQueued=true;requestAnimationFrame(()=>{
      scrollQueued=false;
      const threshold=shell.getBoundingClientRect().top+Math.min(160,shell.clientHeight*.2);
      const views=[...shell.querySelectorAll('.view.collection-current')];
      const view=views.find(v=>v.getBoundingClientRect().bottom>threshold)||views.at(-1);
      selectVisibleView(view);
      const bar=document.querySelector('#readingProgress span');
      if(bar)bar.style.width=(100*shell.scrollTop/Math.max(1,shell.scrollHeight-shell.clientHeight))+'%';
    });
  },{passive:true});
  // An edit/selection may begin in the next visible case before the scroll threshold changes.
  for(const event of ['pointerdown','focusin'])shell.addEventListener(event,e=>{if(continuous())selectVisibleView(e.target.closest('.view.collection-current'));},true);
  let wasFocus=document.body.classList.contains('focus-mode');
  new MutationObserver(()=>{
    const focus=document.body.classList.contains('focus-mode');if(focus===wasFocus)return;wasFocus=focus;
    if(current==='upload')return;
    const view=document.getElementById('view-'+current);
    if(focus){
      const offset=view?.scrollTop||0;
      requestAnimationFrame(()=>{view?.scrollIntoView({block:'start',behavior:'instant'});shell.scrollTop+=offset;});
    }else{
      const offset=view ? Math.max(0,shell.getBoundingClientRect().top-view.getBoundingClientRect().top) : 0;
      shell.scrollTop=0;requestAnimationFrame(()=>{if(view)view.scrollTop=offset;});
    }
  }).observe(document.body,{attributes:true,attributeFilter:['class']});
  window.addEventListener('storage',e=>{if(e.key===GEN_STORE)renderHistory();});

  window.seeuUpload={generate:generateFromInput,selectFile:installFileReader,clear:clearUpload,extract:parseMaterial};
function init(){
  addUploadView();
  addUploadNav();

  // 删除第一版 MVP 的旧目录
  document.querySelectorAll('#nav .nav-card').forEach(function(btn){
    const target=btn.dataset.target || '';
    if(target !== 'upload' && !target.startsWith('generated')){
      btn.remove();
    }
  });

  // 删除第一版 MVP 的旧正文
  document.querySelectorAll('.view').forEach(function(view){
    if(view.id !== 'view-upload' && !view.id.startsWith('view-generated')){
      view.remove();
    }
  });

  // 默认只显示上传页
  document.querySelectorAll('.view').forEach(function(view){
    view.classList.remove('active');
  });

  const uploadView=document.getElementById('view-upload');
  if(uploadView) uploadView.classList.add('active');

  document.querySelectorAll('#nav .nav-card').forEach(function(btn){
    btn.classList.remove('active');
  });

  const uploadNav=document.querySelector('#nav .nav-card[data-target="upload"]');
  if(uploadNav) uploadNav.classList.add('active');

  current='upload';

  const currentLabel=document.getElementById('currentCase');
  if(currentLabel) currentLabel.textContent='当前：上传生成';

  document.body.classList.add('seeu-uploading');
  document.querySelector('.brand h2').textContent='SeeUNotes';
  document.querySelector('.brand h2').removeAttribute('data-zh');
  document.querySelector('.brand h2').removeAttribute('data-en');
  const drop=document.querySelector('.upload-dropzone');
  drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById('uploadFile').click();}});
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragging');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('dragging'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('dragging');if(document.getElementById('generateNoteBtn').disabled)return;const files=e.dataTransfer.files;if(files.length){document.getElementById('uploadFile').files=files;installFileReader();}});
  document.getElementById('nav').hidden=true;
  patchNavClick();
  renderAllGenerated();
  updateOverviewForGenerated();
  renderHistory();
  const pending=pendingJob();if(pending)resumeJob(pending);
}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>










<script id="seeu-annotation-links-v3">
(function(){
  function persist(){saveNotes();}
  function unlinkMark(mark){const id=mark.dataset.annotationId;unwrap(mark);if(id){document.querySelectorAll('#annotations .ann').forEach(a=>{if(a.dataset.annotationId===id){a.dataset.detached='true';const label=a.querySelector('.annotation-state');if(label)label.textContent='高亮已取消，批注保留';}});}persist();}
  window.enhanceAnnotations=function(){
    const active=document.querySelector('.view.active');
    document.querySelectorAll('#annotations .ann').forEach(ann=>{
      if(!ann.dataset.annotationId){ann.dataset.annotationId=crypto.randomUUID();const text=ann.querySelector('q')?.textContent;const matches=[...(active?.querySelectorAll('mark.annotation-yellow')||[])].filter(m=>!m.dataset.annotationId&&m.textContent===text);if(matches.length===1)matches[0].dataset.annotationId=ann.dataset.annotationId;}
      ann.querySelectorAll('.annotation-actions').forEach(el=>el.remove());
      {
        const actions=document.createElement('div');actions.className='annotation-actions';actions.contentEditable='false';
        const state=document.createElement('small');state.className='annotation-state';state.textContent=ann.dataset.detached?'高亮已取消，批注保留':'批注';actions.appendChild(state);
        const remove=document.createElement('button');remove.type='button';remove.textContent='删除批注及高亮';
        remove.onclick=()=>{if(!confirm('删除这条批注及对应高亮？'))return;const id=ann.dataset.annotationId;document.querySelectorAll('.view.active mark.annotation-yellow').forEach(m=>{if(m.dataset.annotationId===id)unwrap(m);});ann.remove();persist();};actions.appendChild(remove);ann.appendChild(actions);
      }
    });
  };
  window.addAnnotation=function(){
    if(!restoreSelection())return;const selection=getSelection();if(!selection.rangeCount)return;const range=selection.getRangeAt(0),text=selection.toString().trim();if(!text)return;
    const id=crypto.randomUUID();let linked=false;
    if(isSafeSingleTextRange(range)){const mark=document.createElement('mark');mark.className='annotation-yellow';mark.dataset.annotationId=id;mark.title='点击取消高亮（保留批注）';try{range.surroundContents(mark);linked=true;}catch{}}
    const ann=document.createElement('div');ann.className='ann';ann.dataset.annotationId=id;if(!linked)ann.dataset.detached='true';
    const quote=document.createElement('q');quote.textContent=text;const body=document.createElement('div');body.contentEditable='true';body.textContent='我的批注：';ann.append(quote,body);document.getElementById('annotations').prepend(ann);
    selection.removeAllRanges();document.getElementById('toolbar').style.display='none';enhanceAnnotations();persist();
  };
  document.addEventListener('click',e=>{const mark=e.target.closest?.('mark.annotation-yellow');if(!mark)return;e.preventDefault();e.stopImmediatePropagation();enhanceAnnotations();if(confirm('取消这处高亮？右侧批注会保留。'))unlinkMark(mark);},true);
  const oldLoad=window.loadNotes;window.loadNotes=function(k){oldLoad(k);enhanceAnnotations();};
})();
</script>


<script id="seeu-workspace-ui">
(function(){
 function init(){
  const bar=document.querySelector('.workspace-bar'),controls=document.querySelector('.seeu-mode-controls'),toggle=document.querySelector('.library-toggle');
  bar.appendChild(controls);
  function close(){document.body.classList.remove('library-open');toggle.setAttribute('aria-expanded','false');}
  toggle.addEventListener('click',()=>{const on=document.body.classList.toggle('library-open');toggle.setAttribute('aria-expanded',String(on));});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('library-open')){close();toggle.focus();}});
  document.querySelector('.sidebar').addEventListener('click',e=>{if(e.target.closest('.library-note,.nav-card'))close();});
  const meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);
  function theme(){const dark=document.body.classList.contains('dark-mode');meta.content=dark?'#24211c':'#fffcf6';document.documentElement.style.colorScheme=dark?'dark':'light';}
  let reviewed=false,previousFocus=null;
  function state(){theme();const review=document.body.classList.contains('review-mode');const menu=document.body.classList.contains('library-open')&&matchMedia('(max-width:760px)').matches;
   document.querySelectorAll('.view').forEach(el=>el.inert=review);
   document.querySelector('.main-shell').inert=menu;document.querySelector('.rightbar').inert=menu;
   if(review&&!reviewed){previousFocus=document.activeElement;document.querySelector('.review-exit').focus();}
   if(!review&&reviewed&&previousFocus?.isConnected)previousFocus.focus();reviewed=review;
  }
  new MutationObserver(state).observe(document.body,{attributes:true,attributeFilter:['class']});window.addEventListener('resize',state);state();
  function accessible(root){
   root.querySelectorAll('button[title]').forEach(el=>{if(!el.hasAttribute('aria-label'))el.setAttribute('aria-label',el.title);});
   root.querySelectorAll('input,select').forEach(el=>{if(el.id)el.name=el.id;if(el.type!=='file')el.autocomplete='off';});
   root.querySelectorAll('.qa-hint').forEach(el=>{const label=el.closest('.qa-flip')?.dataset.side==='a'?'返回问题':'查看参考答案';if(el.textContent!==label)el.textContent=label;el.title=label;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',label);});
   root.querySelectorAll('.tagpill,.method-item>b').forEach(el=>{el.tabIndex=0;el.title=el.textContent;});
  }
  accessible(document);
  new MutationObserver(changes=>{for(const change of changes)for(const node of change.addedNodes)if(node.nodeType===1)accessible(node.parentElement||node);}).observe(document.querySelector('.layout'),{childList:true,subtree:true});

 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script></body></html>
